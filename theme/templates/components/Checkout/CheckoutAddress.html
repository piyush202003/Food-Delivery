<section>
    <div class="bg-white rounded-2xl p-6 animate-fade-in">
        <h2 class="text-lg font-semibold text-green-900 mb-5 flex items-center gap-2">
            <i data-lucide="map-pin" class="size-5"></i>
            Delivery Address
        </h2>
        
        {% if user.addresses and user.addresses|length > 0 %}
            <div class="mb-6">
                <h3 class="text-sm font-semibold text-green-900 mb-3">Saved Addresses</h3>
                <div class="grid sm:grid-cols-2 gap-3">
                    
                    {% for addr in user.addresses %}
                        <a href="{% url 'Checkout' %}?addrId={{ addr.id }}">
                            <div class="p-4 rounded-xl border cursor-pointer transition-colors
                            {% if address.label == addr.label and address.address == addr.address %}
                                border-green-50 bg-amber-100
                            {% else %}
                                border-zinc-400 hover:bg-amber-100
                            {% endif %}
                            ">
                                <div class="flex items-center gap-2 mb-1">
                                    <i data-lucide="map-pin" class="size-4 text-green-900"></i>
                                    <span class="font-semibold text-zinc-900 text-sm">{{ addr.label }}</span>
                                    {% if addr.isDefault %}
                                        <span class="text-[10px] font-semibold text-orange-400 uppercase tracking-wider bg-orange-50 px-2 py-0.5 rounded-full">Default</span>
                                    {% endif %}
                                </div>
                                <p class="text-sm text-zinc-600 truncate">{{ addr.address }}</p>  
                                <p class="text-xs text-zinc-500">{{ addr.city }}, {{ addr.state }} {{ addr.zip }}</p>
                            </div>
                        </a>
                    {% endfor %}
                    <a href="{% url 'Addresses' %}" class="mt-6 px-6 py-3 border border-gray-600 text-gray-600 rounded-xl flex items-center justify-center gap-2">
                        Add New Address
                        <i data-lucide="plus" class="size-4"></i>
                    </a>
                    <a href="{% url 'Checkout' %}?step=payment">
                        <button class="mt-6 px-6 py-3 bg-green-900 text-white font-semibold rounded-xl hover:bg-green-600 transition-colors disabled:opacity-50 flex items-center gap-2"
                        {% if not address.address or not address.city %}
                            disabled
                        {% endif %}
                        >
                            Continue to Payment
                            <i data-lucide="chevron-right" class="size-4"></i>
                        </button>
                    </a>
                </div>
            </div>
        {% endif %}
            
    </div>
</section>
