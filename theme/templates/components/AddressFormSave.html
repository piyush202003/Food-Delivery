{% load static %}

<section class="hidden" id="save-address-form">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-black/40 z-50"/>

    <!-- form container -->
    <div class="insert-0 z-50 flex items-center justify-center p-4">
        <form method="post" class="bg-white rounded-2xl p-6 w-full max-w-lg animate-fade-in">
            {% csrf_token %}

            <!-- Form header -->
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-semibold text-green-900">
                    Add New Address
                </h2>
                <button id="cl-address-form-btn" class="p-2 hover:bg-amber-200 rounded-lg">
                    <i data-lucide="x" class="size-5"></i>
                </button>
            </div>

            <!-- Form Input Fields -->
            <div class="space-y-4">
                <div>
                    <label for="" class="block text-sm font-medium text-shadow-green-900 mb-1.5">Label</label>
                    <input type="text" name="label" placeholder="Home, Work, etc." required class="w-full px-4 py-2.5 text-sm rounded-xl border border-zinc-300 focus:border-green-900 outline-none">
                </div>

                <div>
                    <label for="" class="block text-sm font-medium text-shadow-green-900 mb-1.5">Street Address</label>
                    <input type="text" name="streetAddress" required class="w-full px-4 py-2.5 text-sm rounded-xl border border-zinc-300 focus:border-green-900 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="" class="block text-sm font-medium text-shadow-green-900 mb-1.5">City</label>
                        <input type="text" name="city" placeholder="Mumbai, Pune, etc." required class="w-full px-4 py-2.5 text-sm rounded-xl border border-zinc-300 focus:border-green-900 outline-none">
                    </div>
                    <div >
                        <label for="" class="block text-sm font-medium text-shadow-green-900 mb-1.5">State</label>
                        <input type="text" name="state" placeholder="Maharashtra, Delhi, etc." required class="w-full px-4 py-2.5 text-sm rounded-xl border border-zinc-300 focus:border-green-900 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="" class="block text-sm font-medium text-shadow-green-900 mb-1.5">Zip Code</label>
                        <input type="text" name="city" placeholder="6-Digit code of city" required class="w-full px-4 py-2.5 text-sm rounded-xl border border-zinc-300 focus:border-green-900 outline-none">
                    </div>
                    <div class="flex items-end pb-1" >
                        <label for="" class="flex items-center gap-2">
                            <input type="checkbox" name="setDefalut">
                            <span class="text-sm text-zinc-400">Set as default</span>
                        </label>
                    </div>
                </div>
            </div> 

            <button type="submit" class="mt-6 w-full py-3 bg-green-900 text-white font-semibold rounded-xl hover:bg-green-600 transition-colors">
                Save Address
            </button>
        </form>
    </div>
</section>

<script>
    const addressForm2 = document.getElementById('save-address-form');
    

    const clAddressFormBtn = document.getElementById('cl-address-form-btn');
    if(clAddressFormBtn){
        clAddressFormBtn.addEventListener('click',()=>{
            addressForm2.classList.add('hidden');
            sessionStorage.removeItem('showAddressForm');
        })
    }

    if (sessionStorage.getItem("showAddressForm") === "true") {
        
        addressForm2.classList.remove("hidden");
        // cartSidebarRight.classList.add('animate-slide-in-right');
    }
</script>
